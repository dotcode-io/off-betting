version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: off-betting
    container_name: off-betting-app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/supervisor:/etc/supervisor/conf.d
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - REVERB_APP_ID=928134
      - REVERB_APP_KEY=rgjtcdesot3ej1pg8vt3
      - REVERB_APP_SECRET=dppwarecleaoo2hiodus
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    depends_on:
      - redis
    networks:
      - off-betting
  nginx:
    image: nginx:alpine
    container_name: off-betting-nginx
    restart: always
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:8080:8080"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - off-betting

  mysql:
    image: mysql:8.0
    container_name: off-betting-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-off_betting}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-off_betting}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - off-betting

  redis:
    image: redis:alpine
    container_name: off-betting-redis
    restart: always
    ports:
      - "0.0.0.0:6380:6379"
    volumes:
      - redisdata:/data
    networks:
      - off-betting

networks:
  off-betting:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
